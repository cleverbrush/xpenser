name: PR Environments

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: xpenser-pr-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  ci:
    name: Lint and test
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup npm
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  deploy:
    name: Deploy PR environment
    needs: ci
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: pr-${{ github.event.number }}
      url: https://xpenser-pr-${{ github.event.number }}.${{ vars.PR_ENV_DOMAIN_SUFFIX || 'cleverbrush.com' }}

    steps:
      - name: Configure SSH
        env:
          PR_ENV_NGINX_SSH_KNOWN_HOSTS: ${{ secrets.PR_ENV_NGINX_SSH_KNOWN_HOSTS }}
          PR_ENV_NGINX_SSH_PRIVATE_KEY: ${{ secrets.PR_ENV_NGINX_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PR_ENV_NGINX_SSH_PRIVATE_KEY" > ~/.ssh/xpenser-pr-env-nginx
          chmod 600 ~/.ssh/xpenser-pr-env-nginx
          printf '%s\n' "$PR_ENV_NGINX_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          GIT_REPOSITORY_URL: ${{ vars.GIT_REPOSITORY_URL || 'git@github.com:cleverbrush/xpenser.git' }}
          PASSPORT_BASE_URL: ${{ vars.PASSPORT_BASE_URL || 'https://auth.cleverbrush.com' }}
          PASSPORT_SERVICE_KEY: ${{ secrets.PASSPORT_SERVICE_KEY }}
          PR_ENV_DOMAIN_SUFFIX: ${{ vars.PR_ENV_DOMAIN_SUFFIX || 'cleverbrush.com' }}
          PR_ENV_OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.PR_ENV_OTEL_EXPORTER_OTLP_ENDPOINT }}
          PR_ENV_PORT_BASE: ${{ vars.PR_ENV_PORT_BASE || '3000' }}
          PR_ENV_ROOT: ${{ vars.PR_ENV_ROOT || '/opt/xpenser-pr-envs' }}
          PR_ENV_STATE_DIR: ${{ vars.PR_ENV_STATE_DIR || '/var/lib/xpenser-pr-envs' }}
          PR_ENV_WEB_BIND_ADDRESS: ${{ vars.PR_ENV_WEB_BIND_ADDRESS }}
          PR_ENV_NGINX_PROXY_SCRIPT: ${{ secrets.PR_ENV_NGINX_PROXY_SCRIPT }}
          PR_ENV_NGINX_SSH_HOST: ${{ secrets.PR_ENV_NGINX_SSH_HOST }}
          PR_ENV_NGINX_SSH_PORT: ${{ secrets.PR_ENV_NGINX_SSH_PORT || '22' }}
          PR_ENV_NGINX_SSH_USER: ${{ secrets.PR_ENV_NGINX_SSH_USER }}
          PR_NUMBER: ${{ github.event.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PROD_COMPOSE_PROJECT: ${{ vars.PROD_COMPOSE_PROJECT || 'xpenser' }}
        run: |
          set -euo pipefail
          : "${PR_ENV_NGINX_PROXY_SCRIPT:?PR_ENV_NGINX_PROXY_SCRIPT is required}"
          : "${PR_ENV_WEB_BIND_ADDRESS:?PR_ENV_WEB_BIND_ADDRESS repository variable is required}"
          ssh_port="${PR_ENV_NGINX_SSH_PORT:-22}"
          remote_script="$(printf '%q' "$PR_ENV_NGINX_PROXY_SCRIPT")"
          b64() {
            printf '%s' "$1" | base64 -w 0
            printf '\n'
          }

          {
            b64 "$PASSPORT_SERVICE_KEY"
            b64 "$PR_ENV_DOMAIN_SUFFIX"
            b64 "$PASSPORT_BASE_URL"
            b64 "$PROD_COMPOSE_PROJECT"
            b64 "$PR_ENV_ROOT"
            b64 "$PR_ENV_STATE_DIR"
            b64 "$PR_ENV_WEB_BIND_ADDRESS"
            b64 "$PR_ENV_PORT_BASE"
            b64 "$GIT_REPOSITORY_URL"
            b64 "$PR_ENV_OTEL_EXPORTER_OTLP_ENDPOINT"
          } | ssh -T -o BatchMode=yes -i ~/.ssh/xpenser-pr-env-nginx -p "$ssh_port" \
            "$PR_ENV_NGINX_SSH_USER@$PR_ENV_NGINX_SSH_HOST" \
            "PR_ENV_SECRET_STREAM=1 ${remote_script} deploy '${PR_NUMBER}' '${PR_SHA}'"

  cleanup:
    name: Cleanup PR environment
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: pr-${{ github.event.number }}
      url: https://xpenser-pr-${{ github.event.number }}.${{ vars.PR_ENV_DOMAIN_SUFFIX || 'cleverbrush.com' }}

    steps:
      - name: Configure SSH
        env:
          PR_ENV_NGINX_SSH_KNOWN_HOSTS: ${{ secrets.PR_ENV_NGINX_SSH_KNOWN_HOSTS }}
          PR_ENV_NGINX_SSH_PRIVATE_KEY: ${{ secrets.PR_ENV_NGINX_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PR_ENV_NGINX_SSH_PRIVATE_KEY" > ~/.ssh/xpenser-pr-env-nginx
          chmod 600 ~/.ssh/xpenser-pr-env-nginx
          printf '%s\n' "$PR_ENV_NGINX_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Cleanup
        env:
          GIT_REPOSITORY_URL: ${{ vars.GIT_REPOSITORY_URL || 'git@github.com:cleverbrush/xpenser.git' }}
          PASSPORT_BASE_URL: ${{ vars.PASSPORT_BASE_URL || 'https://auth.cleverbrush.com' }}
          PASSPORT_SERVICE_KEY: ${{ secrets.PASSPORT_SERVICE_KEY }}
          PR_ENV_DOMAIN_SUFFIX: ${{ vars.PR_ENV_DOMAIN_SUFFIX || 'cleverbrush.com' }}
          PR_ENV_PORT_BASE: ${{ vars.PR_ENV_PORT_BASE || '3000' }}
          PR_ENV_ROOT: ${{ vars.PR_ENV_ROOT || '/opt/xpenser-pr-envs' }}
          PR_ENV_STATE_DIR: ${{ vars.PR_ENV_STATE_DIR || '/var/lib/xpenser-pr-envs' }}
          PR_ENV_WEB_BIND_ADDRESS: ${{ vars.PR_ENV_WEB_BIND_ADDRESS }}
          PR_ENV_NGINX_PROXY_SCRIPT: ${{ secrets.PR_ENV_NGINX_PROXY_SCRIPT }}
          PR_ENV_NGINX_SSH_HOST: ${{ secrets.PR_ENV_NGINX_SSH_HOST }}
          PR_ENV_NGINX_SSH_PORT: ${{ secrets.PR_ENV_NGINX_SSH_PORT || '22' }}
          PR_ENV_NGINX_SSH_USER: ${{ secrets.PR_ENV_NGINX_SSH_USER }}
          PR_NUMBER: ${{ github.event.number }}
          PROD_COMPOSE_PROJECT: ${{ vars.PROD_COMPOSE_PROJECT || 'xpenser' }}
        run: |
          set -euo pipefail
          : "${PR_ENV_NGINX_PROXY_SCRIPT:?PR_ENV_NGINX_PROXY_SCRIPT is required}"
          ssh_port="${PR_ENV_NGINX_SSH_PORT:-22}"
          remote_script="$(printf '%q' "$PR_ENV_NGINX_PROXY_SCRIPT")"
          b64() {
            printf '%s' "$1" | base64 -w 0
            printf '\n'
          }

          {
            b64 "$PASSPORT_SERVICE_KEY"
            b64 "$PR_ENV_DOMAIN_SUFFIX"
            b64 "$PASSPORT_BASE_URL"
            b64 "$PROD_COMPOSE_PROJECT"
            b64 "$PR_ENV_ROOT"
            b64 "$PR_ENV_STATE_DIR"
            b64 "$PR_ENV_WEB_BIND_ADDRESS"
            b64 "$PR_ENV_PORT_BASE"
            b64 "$GIT_REPOSITORY_URL"
            b64 ""
          } | ssh -T -o BatchMode=yes -i ~/.ssh/xpenser-pr-env-nginx -p "$ssh_port" \
            "$PR_ENV_NGINX_SSH_USER@$PR_ENV_NGINX_SSH_HOST" \
            "PR_ENV_SECRET_STREAM=1 ${remote_script} cleanup '${PR_NUMBER}'"
