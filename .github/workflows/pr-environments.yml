name: PR Environments

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to clean up
        required: true
        type: number

permissions:
  contents: read
  deployments: write
  pull-requests: read

concurrency:
  group: ${{ vars.PR_ENV_PROJECT_NAME || 'xpenser' }}-pr-${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.number }}
  cancel-in-progress: false

jobs:
  ci:
    name: Lint and test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup npm
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  deploy:
    name: Deploy PR environment
    needs: ci
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: pr-${{ github.event.number }}
      url: ${{ steps.preview-url.outputs.url }}

    steps:
      - name: Preview URL
        id: preview-url
        env:
          PR_ENV_DOMAIN_PROJECT: ${{ vars.PR_ENV_DOMAIN_PROJECT || vars.PR_ENV_PROJECT_NAME || 'xpenser' }}
          PR_ENV_DOMAIN_SUFFIX: ${{ vars.PR_ENV_DOMAIN_SUFFIX || 'cleverbrush.com' }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          printf 'url=https://%s-pr-%03d.%s\n' \
            "$PR_ENV_DOMAIN_PROJECT" \
            "$PR_NUMBER" \
            "$PR_ENV_DOMAIN_SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          PR_ENV_NGINX_SSH_KNOWN_HOSTS: ${{ secrets.PR_ENV_NGINX_SSH_KNOWN_HOSTS }}
          PR_ENV_NGINX_SSH_PRIVATE_KEY: ${{ secrets.PR_ENV_NGINX_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PR_ENV_NGINX_SSH_PRIVATE_KEY" > ~/.ssh/pr-env-nginx
          chmod 600 ~/.ssh/pr-env-nginx
          printf '%s\n' "$PR_ENV_NGINX_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
          BRANDFETCH_API_KEY: ${{ secrets.BRANDFETCH_API_KEY }}
          BRANDFETCH_CLIENT_ID: ${{ vars.BRANDFETCH_CLIENT_ID }}
          GIT_REPOSITORY_URL: ${{ vars.GIT_REPOSITORY_URL || format('git@github.com:{0}.git', github.repository) }}
          VENDOR_ENRICHMENT_ENABLED: ${{ vars.VENDOR_ENRICHMENT_ENABLED || '0' }}
          VENDOR_ENRICHMENT_TIMEOUT_MS: ${{ vars.VENDOR_ENRICHMENT_TIMEOUT_MS || '2000' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REPORT_MODEL: ${{ vars.OPENAI_REPORT_MODEL || 'gpt-5-mini' }}
          PASSPORT_BASE_URL: ${{ vars.PASSPORT_BASE_URL || 'https://auth.cleverbrush.com' }}
          PASSPORT_PROJECT: ${{ vars.PASSPORT_PROJECT || vars.PR_ENV_PROJECT_NAME || 'xpenser' }}
          PASSPORT_SERVICE_KEY: ${{ secrets.PASSPORT_SERVICE_KEY }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || vars.PR_ENV_PROJECT_NAME || 'xpenser' }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || vars.PR_ENV_PROJECT_NAME || 'xpenser' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || secrets.EMAIL_FROM }}
          EMAIL_REPORTS_ENABLED: ${{ vars.EMAIL_REPORTS_ENABLED || secrets.EMAIL_REPORTS_ENABLED || '0' }}
          EMAIL_REPORTS_SCHEDULER_ENABLED: ${{ vars.EMAIL_REPORTS_SCHEDULER_ENABLED || '0' }}
          FEEDBACK_WEBHOOK_URL: ${{ secrets.FEEDBACK_WEBHOOK_URL }}
          PR_ENV_DOMAIN_PROJECT: ${{ vars.PR_ENV_DOMAIN_PROJECT || vars.PR_ENV_PROJECT_NAME || 'xpenser' }}
          PR_ENV_DOMAIN_SUFFIX: ${{ vars.PR_ENV_DOMAIN_SUFFIX || 'cleverbrush.com' }}
          PR_ENV_DNS_RECORD_CONTENT: ${{ vars.PR_ENV_DNS_RECORD_CONTENT || format('{0}.{1}', vars.PR_ENV_DOMAIN_PROJECT || vars.PR_ENV_PROJECT_NAME || 'xpenser', vars.PR_ENV_DOMAIN_SUFFIX || 'cleverbrush.com') }}
          PR_ENV_DNS_RECORD_PROXIED: ${{ vars.PR_ENV_DNS_RECORD_PROXIED || 'true' }}
          PR_ENV_DNS_RECORD_TTL: ${{ vars.PR_ENV_DNS_RECORD_TTL || '1' }}
          PR_ENV_DNS_RECORD_TYPE: ${{ vars.PR_ENV_DNS_RECORD_TYPE || 'CNAME' }}
          PR_ENV_OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.PR_ENV_OTEL_EXPORTER_OTLP_ENDPOINT }}
          PR_ENV_PORT_BASE: ${{ vars.PR_ENV_PORT_BASE || '3000' }}
          PR_ENV_PROJECT_NAME: ${{ vars.PR_ENV_PROJECT_NAME || 'xpenser' }}
          PR_ENV_ROOT: ${{ vars.PR_ENV_ROOT || '/opt/pr-envs' }}
          PR_ENV_STATE_DIR: ${{ vars.PR_ENV_STATE_DIR || '/var/lib/pr-envs' }}
          PR_ENV_NGINX_PROXY_SCRIPT: ${{ secrets.PR_ENV_NGINX_PROXY_SCRIPT }}
          PR_ENV_NGINX_SSH_HOST: ${{ secrets.PR_ENV_NGINX_SSH_HOST }}
          PR_ENV_NGINX_SSH_PORT: ${{ secrets.PR_ENV_NGINX_SSH_PORT || '22' }}
          PR_ENV_NGINX_SSH_USER: ${{ secrets.PR_ENV_NGINX_SSH_USER }}
          PR_NUMBER: ${{ github.event.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PROD_COMPOSE_PROJECT: ${{ vars.PROD_COMPOSE_PROJECT || vars.PR_ENV_PROJECT_NAME || 'xpenser' }}
        run: |
          set -euo pipefail
          : "${PR_ENV_NGINX_PROXY_SCRIPT:?PR_ENV_NGINX_PROXY_SCRIPT is required}"
          : "${PR_ENV_OTEL_EXPORTER_OTLP_ENDPOINT:?PR_ENV_OTEL_EXPORTER_OTLP_ENDPOINT repository variable is required}"
          ssh_port="${PR_ENV_NGINX_SSH_PORT:-22}"
          remote_script="$(printf '%q' "$PR_ENV_NGINX_PROXY_SCRIPT")"
          b64() {
            printf '%s' "$1" | base64 -w 0
            printf '\n'
          }

          {
            b64 "$PASSPORT_SERVICE_KEY"
            b64 "$PR_ENV_DOMAIN_SUFFIX"
            b64 "$PASSPORT_BASE_URL"
            b64 "$PROD_COMPOSE_PROJECT"
            b64 "$PR_ENV_ROOT"
            b64 "$PR_ENV_STATE_DIR"
            b64 "$PR_ENV_PORT_BASE"
            b64 "$GIT_REPOSITORY_URL"
            b64 "$PR_ENV_OTEL_EXPORTER_OTLP_ENDPOINT"
            b64 "$PR_ENV_PROJECT_NAME"
            b64 "$PR_ENV_DOMAIN_PROJECT"
            b64 "$PASSPORT_PROJECT"
            b64 "$POSTGRES_DB"
            b64 "$POSTGRES_USER"
            b64 "$CLOUDFLARE_API_TOKEN"
            b64 "$CLOUDFLARE_ZONE_ID"
            b64 "$PR_ENV_DNS_RECORD_TYPE"
            b64 "$PR_ENV_DNS_RECORD_CONTENT"
            b64 "$PR_ENV_DNS_RECORD_PROXIED"
            b64 "$PR_ENV_DNS_RECORD_TTL"
            b64 "$BRANDFETCH_API_KEY"
            b64 "$BRANDFETCH_CLIENT_ID"
            b64 "$VENDOR_ENRICHMENT_ENABLED"
            b64 "$VENDOR_ENRICHMENT_TIMEOUT_MS"
            b64 "$OPENAI_API_KEY"
            b64 "$OPENAI_REPORT_MODEL"
            b64 "$RESEND_API_KEY"
            b64 "$EMAIL_FROM"
            b64 "$EMAIL_REPORTS_ENABLED"
            b64 "$EMAIL_REPORTS_SCHEDULER_ENABLED"
            b64 "$FEEDBACK_WEBHOOK_URL"
          } | ssh -T -o BatchMode=yes -i ~/.ssh/pr-env-nginx -p "$ssh_port" \
            "$PR_ENV_NGINX_SSH_USER@$PR_ENV_NGINX_SSH_HOST" \
            "PR_ENV_SECRET_STREAM=1 ${remote_script} deploy '${PR_NUMBER}' '${PR_SHA}'"

  e2e:
    name: Playwright e2e
    needs: deploy
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup npm
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        env:
          PR_ENV_DOMAIN_PROJECT: ${{ vars.PR_ENV_DOMAIN_PROJECT || vars.PR_ENV_PROJECT_NAME || 'xpenser' }}
          PR_ENV_DOMAIN_SUFFIX: ${{ vars.PR_ENV_DOMAIN_SUFFIX || 'cleverbrush.com' }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          printf -v PLAYWRIGHT_BASE_URL 'https://%s-pr-%03d.%s' \
            "$PR_ENV_DOMAIN_PROJECT" \
            "$PR_NUMBER" \
            "$PR_ENV_DOMAIN_SUFFIX"
          export PLAYWRIGHT_BASE_URL
          npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  cleanup:
    name: Cleanup PR environment
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.action == 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          PR_ENV_NGINX_SSH_KNOWN_HOSTS: ${{ secrets.PR_ENV_NGINX_SSH_KNOWN_HOSTS }}
          PR_ENV_NGINX_SSH_PRIVATE_KEY: ${{ secrets.PR_ENV_NGINX_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PR_ENV_NGINX_SSH_PRIVATE_KEY" > ~/.ssh/pr-env-nginx
          chmod 600 ~/.ssh/pr-env-nginx
          printf '%s\n' "$PR_ENV_NGINX_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
          GIT_REPOSITORY_URL: ${{ vars.GIT_REPOSITORY_URL || format('git@github.com:{0}.git', github.repository) }}
          PASSPORT_BASE_URL: ${{ vars.PASSPORT_BASE_URL || 'https://auth.cleverbrush.com' }}
          PASSPORT_PROJECT: ${{ vars.PASSPORT_PROJECT || vars.PR_ENV_PROJECT_NAME || 'xpenser' }}
          PASSPORT_SERVICE_KEY: ${{ secrets.PASSPORT_SERVICE_KEY }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || vars.PR_ENV_PROJECT_NAME || 'xpenser' }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || vars.PR_ENV_PROJECT_NAME || 'xpenser' }}
          PR_ENV_DOMAIN_PROJECT: ${{ vars.PR_ENV_DOMAIN_PROJECT || vars.PR_ENV_PROJECT_NAME || 'xpenser' }}
          PR_ENV_DOMAIN_SUFFIX: ${{ vars.PR_ENV_DOMAIN_SUFFIX || 'cleverbrush.com' }}
          PR_ENV_DNS_RECORD_CONTENT: ${{ vars.PR_ENV_DNS_RECORD_CONTENT || format('{0}.{1}', vars.PR_ENV_DOMAIN_PROJECT || vars.PR_ENV_PROJECT_NAME || 'xpenser', vars.PR_ENV_DOMAIN_SUFFIX || 'cleverbrush.com') }}
          PR_ENV_DNS_RECORD_PROXIED: ${{ vars.PR_ENV_DNS_RECORD_PROXIED || 'true' }}
          PR_ENV_DNS_RECORD_TTL: ${{ vars.PR_ENV_DNS_RECORD_TTL || '1' }}
          PR_ENV_DNS_RECORD_TYPE: ${{ vars.PR_ENV_DNS_RECORD_TYPE || 'CNAME' }}
          PR_ENV_PORT_BASE: ${{ vars.PR_ENV_PORT_BASE || '3000' }}
          PR_ENV_PROJECT_NAME: ${{ vars.PR_ENV_PROJECT_NAME || 'xpenser' }}
          PR_ENV_ROOT: ${{ vars.PR_ENV_ROOT || '/opt/pr-envs' }}
          PR_ENV_STATE_DIR: ${{ vars.PR_ENV_STATE_DIR || '/var/lib/pr-envs' }}
          PR_ENV_NGINX_PROXY_SCRIPT: ${{ secrets.PR_ENV_NGINX_PROXY_SCRIPT }}
          PR_ENV_NGINX_SSH_HOST: ${{ secrets.PR_ENV_NGINX_SSH_HOST }}
          PR_ENV_NGINX_SSH_PORT: ${{ secrets.PR_ENV_NGINX_SSH_PORT || '22' }}
          PR_ENV_NGINX_SSH_USER: ${{ secrets.PR_ENV_NGINX_SSH_USER }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.number }}
          PROD_COMPOSE_PROJECT: ${{ vars.PROD_COMPOSE_PROJECT || vars.PR_ENV_PROJECT_NAME || 'xpenser' }}
        run: |
          set -euo pipefail
          : "${PR_ENV_NGINX_PROXY_SCRIPT:?PR_ENV_NGINX_PROXY_SCRIPT is required}"
          ssh_port="${PR_ENV_NGINX_SSH_PORT:-22}"
          remote_script="$(printf '%q' "$PR_ENV_NGINX_PROXY_SCRIPT")"
          b64() {
            printf '%s' "$1" | base64 -w 0
            printf '\n'
          }

          {
            b64 "$PASSPORT_SERVICE_KEY"
            b64 "$PR_ENV_DOMAIN_SUFFIX"
            b64 "$PASSPORT_BASE_URL"
            b64 "$PROD_COMPOSE_PROJECT"
            b64 "$PR_ENV_ROOT"
            b64 "$PR_ENV_STATE_DIR"
            b64 "$PR_ENV_PORT_BASE"
            b64 "$GIT_REPOSITORY_URL"
            b64 ""
            b64 "$PR_ENV_PROJECT_NAME"
            b64 "$PR_ENV_DOMAIN_PROJECT"
            b64 "$PASSPORT_PROJECT"
            b64 "$POSTGRES_DB"
            b64 "$POSTGRES_USER"
            b64 "$CLOUDFLARE_API_TOKEN"
            b64 "$CLOUDFLARE_ZONE_ID"
            b64 "$PR_ENV_DNS_RECORD_TYPE"
            b64 "$PR_ENV_DNS_RECORD_CONTENT"
            b64 "$PR_ENV_DNS_RECORD_PROXIED"
            b64 "$PR_ENV_DNS_RECORD_TTL"
          } | ssh -T -o BatchMode=yes -i ~/.ssh/pr-env-nginx -p "$ssh_port" \
            "$PR_ENV_NGINX_SSH_USER@$PR_ENV_NGINX_SSH_HOST" \
            "PR_ENV_SECRET_STREAM=1 ${remote_script} cleanup '${PR_NUMBER}'"

      - name: Cleanup GitHub environment
        if: always()
        env:
          PR_ENV_GITHUB_TOKEN: ${{ secrets.PR_ENV_GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          : "${PR_ENV_GITHUB_TOKEN:?PR_ENV_GITHUB_TOKEN secret is required; create a fine-grained PAT with Administration read/write access for this repository}"
          api="https://api.github.com/repos/${REPOSITORY}"
          headers=(
            -H "Authorization: Bearer ${PR_ENV_GITHUB_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          environment_names=("pr-${PR_NUMBER}")
          padded_environment="$(printf 'pr-%03d' "$PR_NUMBER")"
          if [[ "$padded_environment" != "${environment_names[0]}" ]]; then
            environment_names+=("$padded_environment")
          fi

          for environment_name in "${environment_names[@]}"; do
            page=1
            marked=0

            while true; do
              deployments="$(
                curl -fsSL -G "${headers[@]}" \
                  --data-urlencode "environment=${environment_name}" \
                  --data-urlencode "per_page=100" \
                  --data-urlencode "page=${page}" \
                  "${api}/deployments"
              )"
              page_count="$(jq 'length' <<<"$deployments")"
              (( page_count == 0 )) && break

              mapfile -t deployment_ids < <(
                jq -r --arg environment "$environment_name" \
                  '.[] | select(.environment == $environment) | .id' \
                  <<<"$deployments"
              )

              for deployment_id in "${deployment_ids[@]}"; do
                body="$(
                  jq -n \
                    --arg environment "$environment_name" \
                    --arg description "Destroyed ${environment_name}" \
                    '{
                      state: "inactive",
                      environment: $environment,
                      description: $description,
                      auto_inactive: false
                    }'
                )"
                curl -fsSL -X POST "${headers[@]}" \
                  -d "$body" \
                  "${api}/deployments/${deployment_id}/statuses" >/dev/null
                marked="$((marked + 1))"
              done

              (( page_count < 100 )) && break
              page="$((page + 1))"
            done

            encoded_environment="$(jq -nr --arg value "$environment_name" '$value | @uri')"
            response_file="$(mktemp)"
            status="$(
              curl -sSL -X DELETE "${headers[@]}" \
                -o "$response_file" \
                -w '%{http_code}' \
                "${api}/environments/${encoded_environment}" || true
            )"
            case "$status" in
              204)
                printf 'Deleted GitHub environment %s after marking %s deployment(s) inactive\n' \
                  "$environment_name" "$marked"
                ;;
              404)
                printf 'GitHub environment %s is already absent after marking %s deployment(s) inactive\n' \
                  "$environment_name" "$marked"
                ;;
              *)
                printf 'Failed to delete GitHub environment %s with HTTP %s: %s\n' \
                  "$environment_name" "$status" "$(tr '\n' ' ' <"$response_file")" >&2
                rm -f "$response_file"
                exit 1
                ;;
            esac
            rm -f "$response_file"
          done
