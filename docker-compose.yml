services:
  postgres:
    image: postgres:17-alpine
    container_name: xpenser-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-xpenser_db}
      POSTGRES_USER: ${DB_USER:-xpenser_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-xpenser_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-xpenser_user} -d ${DB_NAME:-xpenser_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  signoz-otel-collector:
    image: signoz/signoz-otel-collector:0.102.14
    container_name: xpenser-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"
      - "4318:4318"
    command:
      - "--config=/etc/otel-collector-config.yaml"
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: xpenser-clickhouse
    restart: unless-stopped
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query='SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  query-service:
    image: signoz/query-service:0.55.0
    container_name: xpenser-query-service
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      ClickHouseUrl: tcp://clickhouse:9000
      STORAGE: clickhouse
    ports:
      - "8080:8080"

  frontend:
    image: signoz/frontend:0.55.0
    container_name: xpenser-frontend
    restart: unless-stopped
    depends_on:
      query-service:
        condition: service_started
    ports:
      - "3301:3301"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: xpenser-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-xpenser_db}
      DB_USER: ${DB_USER:-xpenser_user}
      DB_PASSWORD: ${DB_PASSWORD:-xpenser_secret}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (minimum 32 characters)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      API_PORT: 3001
      API_HOST: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-otel-collector:4318
      OTEL_SERVICE_NAME: xpenser-api
    ports:
      - "3001:3001"
    volumes:
      - api_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: xpenser-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:3001
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: xpenser-swagger-ui
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3001/openapi.json
    ports:
      - "8090:8080"
    profiles:
      - docs

networks:
  default:
    name: xpenser-network

volumes:
  postgres_data:
    driver: local
  clickhouse_data:
    driver: local
  api_logs:
    driver: local
