services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xpenser}
      POSTGRES_USER: ${POSTGRES_USER:-xpenser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xpenser_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xpenser} -d ${POSTGRES_DB:-xpenser}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:4000}
      HOST: 0.0.0.0
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-xpenser}
      DB_USER: ${POSTGRES_USER:-xpenser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-xpenser_secret}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min32chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-86400}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FRANKFURTER_BASE_URL: ${FRANKFURTER_BASE_URL:-https://api.frankfurter.dev/v2}
      OTEL_SERVICE_NAME: xpenser-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production-min32chars}
      AUTH_SECRET: ${AUTH_SECRET:-${NEXTAUTH_SECRET:-change-me-in-production-min32chars}}
      API_BASE_URL: http://api:4000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      WEB_OTEL_SERVICE_NAME: xpenser-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      NEXT_OTEL_VERBOSE: "1"
    ports:
      - "${WEB_PORT:-3000}:3000"

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    environment:
      URL: http://localhost:${API_PORT:-4000}/openapi.json
      DISPLAY_OPERATION_ID: "true"
    ports:
      - "${SWAGGER_PORT:-8090}:8080"
    depends_on:
      api:
        condition: service_healthy

  zookeeper-1:
    image: signoz/zookeeper:3.7.1
    restart: unless-stopped
    user: root
    healthcheck:
      test: ["CMD-SHELL", "curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - signoz-zookeeper-1:/bitnami/zookeeper
    environment:
      - ZOO_SERVER_ID=1
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_AUTOPURGE_INTERVAL=1
      - ZOO_ENABLE_PROMETHEUS_METRICS=yes
      - ZOO_PROMETHEUS_METRICS_PORT_NUMBER=9141

  init-clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    restart: on-failure
    user: root
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    volumes:
      - ./deploy/clickhouse/user_scripts:/var/lib/clickhouse/user_scripts/

  clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    restart: unless-stopped
    tty: true
    depends_on:
      init-clickhouse:
        condition: service_completed_successfully
      zookeeper-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - ./deploy/clickhouse/clusters.xml:/etc/clickhouse-server/config.d/clusters.xml:ro
      - ./deploy/clickhouse/custom-function.xml:/etc/clickhouse-server/custom-function.xml:ro
      - ./deploy/clickhouse/user_scripts:/var/lib/clickhouse/user_scripts/
      - signoz-clickhouse:/var/lib/clickhouse/

  signoz-telemetrystore-migrator:
    image: signoz/signoz-otel-collector:v0.144.3
    restart: on-failure
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER=cluster
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION=true
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m

  otel-collector:
    image: signoz/signoz-otel-collector:v0.144.3
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      signoz-telemetrystore-migrator:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER=cluster
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION=true
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    volumes:
      - ./deploy/signoz/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/13133"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  signoz:
    image: signoz/signoz:v0.120.0
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      signoz-telemetrystore-migrator:
        condition: service_completed_successfully
    environment:
      - SIGNOZ_ALERTMANAGER_PROVIDER=signoz
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_SQLSTORE_SQLITE_PATH=/var/lib/signoz/signoz.db
      - SIGNOZ_TOKENIZER_JWT_SECRET=${SIGNOZ_TOKENIZER_JWT_SECRET:-change-me}
    volumes:
      - signoz-sqlite:/var/lib/signoz/
    ports:
      - "${SIGNOZ_PORT:-8080}:8080"

volumes:
  postgres_data:
  signoz-zookeeper-1:
  signoz-clickhouse:
  signoz-sqlite:
