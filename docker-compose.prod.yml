services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xpenser}
      POSTGRES_USER: ${POSTGRES_USER:-xpenser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xpenser_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xpenser} -d ${POSTGRES_DB:-xpenser}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:4000}
      HOST: 0.0.0.0
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-xpenser}
      DB_USER: ${POSTGRES_USER:-xpenser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-xpenser_secret}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min32chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-86400}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_SERVICE_SECRET: ${TELEGRAM_BOT_SERVICE_SECRET:-change-me-in-production-min32chars}
      TELEGRAM_LINK_TOKEN_TTL_SECONDS: ${TELEGRAM_LINK_TOKEN_TTL_SECONDS:-600}
      TELEGRAM_JWT_EXPIRES_IN: ${TELEGRAM_JWT_EXPIRES_IN:-300}
      FRANKFURTER_BASE_URL: ${FRANKFURTER_BASE_URL:-https://api.frankfurter.dev/v2}
      OTEL_SERVICE_NAME: ${OTEL_API_SERVICE_NAME:-xpenser-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production-min32chars}
      AUTH_SECRET: ${AUTH_SECRET:-${NEXTAUTH_SECRET:-change-me-in-production-min32chars}}
      API_BASE_URL: http://api:4000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      WEB_OTEL_SERVICE_NAME: ${OTEL_WEB_SERVICE_NAME:-xpenser-web}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      NEXT_OTEL_VERBOSE: "1"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  telegram-bot:
    build:
      context: .
      dockerfile: apps/telegram-bot/Dockerfile
    depends_on:
      api:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:4000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_SERVICE_SECRET: ${TELEGRAM_BOT_SERVICE_SECRET:-change-me-in-production-min32chars}
      OTEL_SERVICE_NAME: ${OTEL_TELEGRAM_SERVICE_NAME:-xpenser-telegram-bot}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}

volumes:
  postgres_data:
