services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xpenser}
      POSTGRES_USER: ${POSTGRES_USER:-xpenser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xpenser_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xpenser} -d ${POSTGRES_DB:-xpenser}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_BASE_URL: ${PUBLIC_API_BASE_URL:-${APP_URL:-http://localhost:3000}/external-api}
      HOST: 0.0.0.0
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-xpenser}
      DB_USER: ${POSTGRES_USER:-xpenser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-xpenser_secret}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1209600}
      WEB_API_SERVICE_SECRET: ${WEB_API_SERVICE_SECRET:-${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}}
      PASSPORT_BASE_URL: ${PASSPORT_BASE_URL:-https://auth.cleverbrush.com}
      PASSPORT_PROJECT: ${PASSPORT_PROJECT:-xpenser}
      PASSPORT_ENVIRONMENT: ${PASSPORT_ENVIRONMENT:-production}
      PASSPORT_PUBLIC_KEY: ${PASSPORT_PUBLIC_KEY:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_SERVICE_SECRET: ${TELEGRAM_BOT_SERVICE_SECRET:?TELEGRAM_BOT_SERVICE_SECRET required}
      TELEGRAM_LINK_TOKEN_TTL_SECONDS: ${TELEGRAM_LINK_TOKEN_TTL_SECONDS:-600}
      TELEGRAM_JWT_EXPIRES_IN: ${TELEGRAM_JWT_EXPIRES_IN:-300}
      FRANKFURTER_BASE_URL: ${FRANKFURTER_BASE_URL:-https://api.frankfurter.dev/v2}
      BRANDFETCH_API_KEY: ${BRANDFETCH_API_KEY:-}
      MERCHANT_ENRICHMENT_ENABLED: ${MERCHANT_ENRICHMENT_ENABLED:-0}
      MERCHANT_ENRICHMENT_TIMEOUT_MS: ${MERCHANT_ENRICHMENT_TIMEOUT_MS:-2000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REPORT_MODEL: ${OPENAI_REPORT_MODEL:-gpt-5-mini}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Xpenser <reports@xpenser.app>}
      EMAIL_REPORTS_ENABLED: ${EMAIL_REPORTS_ENABLED:-0}
      EMAIL_REPORTS_SCHEDULER_ENABLED: ${EMAIL_REPORTS_SCHEDULER_ENABLED:-0}
      EMAIL_REPORTS_DELIVERY_HOUR_LOCAL: ${EMAIL_REPORTS_DELIVERY_HOUR_LOCAL:-8}
      EMAIL_REPORTS_MAX_ATTEMPTS: ${EMAIL_REPORTS_MAX_ATTEMPTS:-3}
      OTEL_SERVICE_NAME: ${OTEL_API_SERVICE_NAME:-xpenser-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${APP_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}
      AUTH_SECRET: ${AUTH_SECRET:-${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}}
      WEB_API_SERVICE_SECRET: ${WEB_API_SERVICE_SECRET:-${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}}
      API_BASE_URL: http://api:4000
      PASSPORT_BASE_URL: ${PASSPORT_BASE_URL:-https://auth.cleverbrush.com}
      PASSPORT_PROJECT: ${PASSPORT_PROJECT:-xpenser}
      PASSPORT_ENVIRONMENT: ${PASSPORT_ENVIRONMENT:-production}
      WEB_OTEL_SERVICE_NAME: ${OTEL_WEB_SERVICE_NAME:-xpenser-web}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    ports:
      - "0.0.0.0:${WEB_PORT:-3000}:3000"

  telegram-bot:
    build:
      context: .
      dockerfile: apps/telegram-bot/Dockerfile
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:4000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_SERVICE_SECRET: ${TELEGRAM_BOT_SERVICE_SECRET:?TELEGRAM_BOT_SERVICE_SECRET required}
      OTEL_SERVICE_NAME: ${OTEL_TELEGRAM_SERVICE_NAME:-xpenser-telegram-bot}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}

volumes:
  postgres_data:
